name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Configure Gradle
        run: |
          cat >> gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx2g
          org.gradle.workers.max=2
          EOF

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/n0kontzzz-ci.keystore"
          chmod 600 "$RUNNER_TEMP/n0kontzzz-ci.keystore"

      - name: Build signed Debug APK
        env:
          CI_KEYSTORE_PATH: ${{ runner.temp }}/n0kontzzz-ci.keystore
          CI_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CI_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          CI_VERSION_CODE: ${{ github.run_number }}
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verify APK
        run: |
          APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "Generated APK:"
          ls -lh "$APK"

      - name: Rename APK
        run: |
          APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)

          cp "$APK" \
            app/build/outputs/apk/debug/N0Kontzzz-Kernel-Manager-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: N0Kontzzz-Kernel-Manager-debug
          path: app/build/outputs/apk/debug/N0Kontzzz-Kernel-Manager-debug.apk
          if-no-files-found: error

      - name: Clean signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/n0kontzzz-ci.keystore"
