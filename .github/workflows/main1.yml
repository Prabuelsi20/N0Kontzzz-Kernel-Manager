name: Build & Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: v1.0.0
  RELEASE_NAME: "N0Kontzzz Kernel Manager v1.0.0 - Universal Kernel Build"
  APK_NAME: "N0Kontzzz-Kernel-Manager-v1.0.0-universal.apk"

jobs:
  build:
    name: Build, Scan & Release
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # ============================================================
      # JAVA / ANDROID
      # ============================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # ============================================================
      # GRADLE
      # ============================================================

      - name: Configure Gradle
        run: |
          cat >> gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx2g
          org.gradle.workers.max=2
          EOF

      # ============================================================
      # SIGNING
      # ============================================================

      - name: Restore CI signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/n0kontzzz-ci.keystore"

          chmod 600 "$RUNNER_TEMP/n0kontzzz-ci.keystore"

          echo "CI signing keystore restored."

      # ============================================================
      # BUILD RELEASE
      # ============================================================

      - name: Build signed Release APK
        env:
          CI_KEYSTORE_PATH: ${{ runner.temp }}/n0kontzzz-ci.keystore
          CI_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CI_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          CI_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail

          ./gradlew assembleRelease \
            --stacktrace \
            --no-daemon

      # ============================================================
      # FIND APK
      # ============================================================

      - name: Locate Release APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo "source=$APK" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Generated APK:"
          ls -lh "$APK"

      # ============================================================
      # PREPARE RELEASE ASSET
      # ============================================================

      - name: Prepare Release APK
        run: |
          set -euo pipefail

          mkdir -p release

          cp "${{ steps.apk.outputs.source }}" \
            "release/${{ env.APK_NAME }}"

          echo "Final APK:"
          ls -lh "release/${{ env.APK_NAME }}"

      # ============================================================
      # SIGNATURE VERIFICATION
      # ============================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="release/${{ env.APK_NAME }}"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "apksigner" \
            | sort -V \
            | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            exit 1
          fi

          echo "Using:"
          echo "$APKSIGNER"

          "$APKSIGNER" verify \
            --verbose \
            "$APK"

      # ============================================================
      # HASHES
      # ============================================================

      - name: Generate APK checksums
        shell: bash
        run: |
          set -euo pipefail

          APK="release/${{ env.APK_NAME }}"

          echo "========================================"
          echo "APK CHECKSUMS"
          echo "========================================"

          echo ""
          echo "SHA-256:"
          sha256sum "$APK"

          echo ""
          echo "SHA-1:"
          sha1sum "$APK"

          echo ""
          echo "MD5:"
          md5sum "$APK"

      # ============================================================
      # VIRUSTOTAL UPLOAD
      # ============================================================

      - name: Upload APK to VirusTotal
        id: virustotal
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$VT_API_KEY" ]; then
            echo "ERROR: VIRUSTOTAL_API_KEY secret is missing."
            exit 1
          fi

          APK="release/${{ env.APK_NAME }}"

          echo "Requesting VirusTotal upload URL..."

          UPLOAD_URL=$(curl -fsS \
            -H "x-apikey: $VT_API_KEY" \
            "https://www.virustotal.com/api/v3/files/upload_url" \
            | jq -r '.data')

          if [ -z "$UPLOAD_URL" ] || [ "$UPLOAD_URL" = "null" ]; then
            echo "ERROR: Failed to obtain VirusTotal upload URL."
            exit 1
          fi

          echo "Uploading APK to VirusTotal..."

          RESPONSE=$(curl -fsS \
            -H "x-apikey: $VT_API_KEY" \
            -F "file=@${APK}" \
            "$UPLOAD_URL")

          ANALYSIS_ID=$(echo "$RESPONSE" | jq -r '.data.id')

          if [ -z "$ANALYSIS_ID" ] || [ "$ANALYSIS_ID" = "null" ]; then
            echo "ERROR: VirusTotal did not return an analysis ID."
            echo "$RESPONSE"
            exit 1
          fi

          echo "analysis_id=$ANALYSIS_ID" >> "$GITHUB_OUTPUT"

          echo ""
          echo "VirusTotal analysis ID:"
          echo "$ANALYSIS_ID"

      # ============================================================
      # VIRUSTOTAL ANALYSIS
      # ============================================================

      - name: Wait for VirusTotal analysis
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          ANALYSIS_ID: ${{ steps.virustotal.outputs.analysis_id }}
        shell: bash
        run: |
          set -euo pipefail

          MAX_ATTEMPTS=40
          SLEEP_SECONDS=15

          echo "Waiting for VirusTotal analysis..."

          for ((i=1; i<=MAX_ATTEMPTS; i++)); do

            RESPONSE=$(curl -fsS \
              -H "x-apikey: $VT_API_KEY" \
              "https://www.virustotal.com/api/v3/analyses/${ANALYSIS_ID}")

            STATUS=$(echo "$RESPONSE" \
              | jq -r '.data.attributes.status')

            echo "Attempt $i/$MAX_ATTEMPTS: $STATUS"

            if [ "$STATUS" = "completed" ]; then
              echo "VirusTotal analysis completed."
              exit 0
            fi

            if [ "$STATUS" != "queued" ] &&
               [ "$STATUS" != "in-progress" ]; then
              echo "ERROR: Unexpected VirusTotal status:"
              echo "$STATUS"
              exit 1
            fi

            sleep "$SLEEP_SECONDS"
          done

          echo "ERROR: VirusTotal analysis timed out."
          exit 1

      # ============================================================
      # VIRUSTOTAL GATE
      # ============================================================

      - name: Check VirusTotal verdict
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          APK="release/${{ env.APK_NAME }}"

          SHA256=$(sha256sum "$APK" | awk '{print $1}')

          REPORT=$(curl -fsS \
            -H "x-apikey: $VT_API_KEY" \
            "https://www.virustotal.com/api/v3/files/${SHA256}")

          MALICIOUS=$(echo "$REPORT" \
            | jq -r '.data.attributes.last_analysis_stats.malicious // 0')

          SUSPICIOUS=$(echo "$REPORT" \
            | jq -r '.data.attributes.last_analysis_stats.suspicious // 0')

          HARMLESS=$(echo "$REPORT" \
            | jq -r '.data.attributes.last_analysis_stats.harmless // 0')

          UNDETECTED=$(echo "$REPORT" \
            | jq -r '.data.attributes.last_analysis_stats.undetected // 0')

          echo ""
          echo "========================================"
          echo "VIRUSTOTAL RESULT"
          echo "========================================"
          echo "Malicious : $MALICIOUS"
          echo "Suspicious: $SUSPICIOUS"
          echo "Harmless  : $HARMLESS"
          echo "Undetected: $UNDETECTED"
          echo ""
          echo "SHA-256:"
          echo "$SHA256"
          echo "========================================"

          cat > virustotal-summary.md <<EOF
          ## VirusTotal Scan

          | Result | Count |
          |---|---:|
          | Malicious | $MALICIOUS |
          | Suspicious | $SUSPICIOUS |
          | Harmless | $HARMLESS |
          | Undetected | $UNDETECTED |

          **SHA-256:** \`$SHA256\`

          [View this APK on VirusTotal](https://www.virustotal.com/gui/file/$SHA256)
          EOF

          if [ "$MALICIOUS" -gt 0 ]; then
            echo ""
            echo "❌ RELEASE BLOCKED"
            echo "VirusTotal reported malicious detections."
            exit 1
          fi

          if [ "$SUSPICIOUS" -gt 0 ]; then
            echo ""
            echo "❌ RELEASE BLOCKED"
            echo "VirusTotal reported suspicious detections."
            exit 1
          fi

          echo ""
          echo "✅ VirusTotal gate passed."

      # ============================================================
      # AUTOMATIC CHANGELOG
      # ============================================================

      - name: Generate release notes from commits
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_TAG="${{ env.RELEASE_TAG }}"

          PREVIOUS_TAG=$(
            git tag --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -v "^${CURRENT_TAG}$" \
            | head -n 1 \
            || true
          )

          echo "Current tag : $CURRENT_TAG"
          echo "Previous tag: ${PREVIOUS_TAG:-none}"

          cat > release-notes.md <<'EOF'
          # N0Kontzzz Kernel Manager v1.0.0

          First custom stable release based on the **N0Kontzzz Kernel Manager** source.

          ## 🚀 Changes

          - Converted the CI build from **Debug** to **Release/Stable**.
          - Enabled R8 code shrinking.
          - Enabled Android resource shrinking.
          - Release APK is signed using the persistent CI signing key.
          - Added automated APK signature verification.
          - Added automatic SHA-256, SHA-1 and MD5 checksum generation.
          - Added automated VirusTotal scanning before publication.
          - Release publication is blocked when VirusTotal reports malicious or suspicious detections.
          - Added automatic commit tracking for release notes.
          - GitHub Actions automatically publishes the verified APK as a GitHub Release.
          - Build version code is generated from the GitHub Actions run number.

          ## 🧩 Kernel Manager Changes

          - Allow rooted kernels without the original kernel whitelist restriction.
          - Kernel support check bypassed.
          - Improved compatibility with custom and modified kernels.
          - Added and modified functionality according to personal kernel-management requirements.

          ## 📝 Changes From Git History

          EOF

          if [ -n "$PREVIOUS_TAG" ]; then

            echo "Tracking commits from $PREVIOUS_TAG to HEAD..."

            git log \
              --pretty=format:'- `%h` %s — **%an**' \
              "${PREVIOUS_TAG}..HEAD" \
              >> release-notes.md

          else

            echo "No previous release tag found."
            echo "Tracking repository commit history..."

            git log \
              --pretty=format:'- `%h` %s — **%an**' \
              --reverse \
              >> release-notes.md

          fi

          cat >> release-notes.md <<'EOF'

          ## 📱 Requirements

          - Android device with root access.
          - Magisk or KernelSU.
          - Root permission must be granted to the application.
          - A kernel exposing the interfaces required by the selected tuning features.

          ## ⚠️ Important Disclaimer

          This project is a **personal / private hobby project** created mainly as a way to fill spare time and experiment with Android kernel management.

          It is **not intended as a public commercial product** and is not being maintained as a general-purpose application for everyone.

          **No suggestions, feature requests, bug reports, support requests, or troubleshooting guarantees are accepted.**

          Use this build only if you understand what you are doing and are comfortable with rooted Android systems and custom kernels.

          Incorrect kernel tuning or unsupported settings may cause:

          - system instability
          - application crashes
          - excessive battery drain
          - overheating
          - performance degradation
          - bootloops
          - soft-bricks or other device-specific issues

          You are responsible for your own device, kernel, configuration, data, and recovery process.

          ## 📌 Project Attribution

          This project is **not 100% my original work**.

          It is a fork / personal modification based on:

          **Original project:**
          https://github.com/bimoalfarrabi/N0Kontzzz-Kernel-Manager/

          My changes are focused on features and modifications that I personally need for my own device, kernel testing, and personal use.

          I am **not presenting this fork as the original project**, and this build should not be interpreted as an official release from the original author.

          Please refer to the original project and its author for the upstream implementation and original project history.

          ## 🧪 Stable Build ≠ Universal Kernel Compatibility

          The **Stable/Release** label refers to the Android build type and CI distribution process.

          It does **not** guarantee that every kernel, device, governor, driver, sysfs node, procfs node, GPU configuration, thermal configuration, I/O configuration, memory feature, or tuning interface will work.

          Feature availability depends on the kernel and hardware implementation.

          The "Universal Kernel Build" name refers to the intended broad compatibility of the application with rooted/custom kernels. It does not mean that every feature is universally supported.

          ## 🔐 Build & Verification

          This APK was:

          - Built automatically using GitHub Actions.
          - Compiled as a Release build.
          - Minified using the project's Release configuration.
          - Resource-shrunk using the project's Release configuration.
          - Signed using the CI release signing key.
          - Signature-verified before publication.
          - Scanned by VirusTotal before the GitHub Release was created.

          ## 📦 APK

          `N0Kontzzz-Kernel-Manager-v1.0.0-universal.apk`

          ## 🙏 Thanks

          Thanks to the original project author and everyone whose work, libraries, kernels, documentation, and open-source contributions make this personal project possible.

          This release exists primarily for **personal experimentation, learning, and filling spare time**.

          Thank you.
          EOF

          echo ""
          echo "========================================"
          echo "GENERATED RELEASE NOTES"
          echo "========================================"
          cat release-notes.md

      # ============================================================
      # GITHUB RELEASE
      # ============================================================

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ env.RELEASE_TAG }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "ERROR: Release $TAG already exists."
            exit 1
          fi

          gh release create "$TAG" \
            "release/${{ env.APK_NAME }}" \
            --title "${{ env.RELEASE_NAME }}" \
            --notes-file release-notes.md \
            --latest

      # ============================================================
      # VIRUSTOTAL REPORT ARTIFACT
      # ============================================================

      - name: Upload VirusTotal report
        uses: actions/upload-artifact@v4
        with:
          name: virustotal-report
          path: virustotal-summary.md
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # CLEANUP
      # ============================================================

      - name: Clean signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/n0kontzzz-ci.keystore"
